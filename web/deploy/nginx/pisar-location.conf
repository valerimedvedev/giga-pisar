# Гига Писарь — вставить в server { } сайта (include этого файла).
# Страница: https://<сайт>/pisar/   Файлы: /var/www/pisar/
# Нужен и pisar-http.conf (limit_req_zone) в контексте http.

location = /pisar { return 301 /pisar/; }

location /pisar/ {
    alias /var/www/pisar/;
    index index.html;

    # Изоляция страницы: с ней браузер даёт WebAssembly-потоки,
    # и распознавание с мозгом идут в несколько ядер.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache" always;

    types {
        text/html                html;
        text/css                 css;
        text/javascript          js mjs;
        application/wasm         wasm;
        application/gzip         gz;
        application/octet-stream gguf onnx model;
        text/yaml                yaml;
    }
}

# Надстройка Word (web/word/): office.js грузится с CDN Microsoft, поэтому
# без изоляции (COEP) — распознавание идёт в один поток, этого хватает.
location /pisar/word/ {
    alias /var/www/pisar/word/;
    index taskpane.html;
    add_header Cache-Control "no-cache" always;
    types { text/html html; text/css css; text/javascript js mjs; text/xml xml; image/png png; }
}

# Модели: большие и неизменные — пусть браузер их не перепроверяет.
location /pisar/brain-models/ {
    alias /var/www/pisar/brain-models/;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    types { application/octet-stream gguf; }
}

# Мозг GigaChat: llama-server на 127.0.0.1:8091 (pisar-brain.service).
# Наружу — только проверка и чат, ничего больше.
location = /pisar/brain/health {
    proxy_pass http://127.0.0.1:8091/health;
    add_header Cache-Control "no-store" always;
}
location = /pisar/brain/v1/chat/completions {
    limit_except POST { deny all; }
    limit_req zone=pisar_brain burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8091/v1/chat/completions;
    proxy_read_timeout 180s;
    proxy_buffering off;
}
location /pisar/brain/ { return 404; }
