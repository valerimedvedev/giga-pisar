# Гига Писарь — кусок для контекста http (например, /etc/nginx/conf.d/pisar-http.conf).
# Ограничение на мозг: GigaChat считает процессор сервера, и без лимита
# любой желающий может его занять. 12 запросов в минуту с одного адреса.
limit_req_zone $binary_remote_addr zone=pisar_brain:10m rate=12r/m;
