# Собирает APK «Гига Писарь Диктовка» на серверах GitHub (там есть Android SDK)
# и выкладывает его в выпуск android-latest: постоянная ссылка
#   https://github.com/valerimedvedev/giga-pisar/releases/download/android-latest/giga-pisar-dictation.apk
# Запуск: вручную (Actions → Android APK → Run workflow) или при изменении android/.
name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android-apk.yml"]
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK (NDK, CMake)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты ядра
        run: cd android && ./gradlew :engine:test --no-daemon
      - name: Сборка APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - name: Переименовать
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk giga-pisar-dictation.apk
          sha256sum giga-pisar-dictation.apk | tee giga-pisar-dictation.apk.sha256
      - uses: actions/upload-artifact@v4
        with: { name: giga-pisar-dictation, path: "giga-pisar-dictation.apk*" }
      - name: Выпуск android-latest
        if: github.ref == 'refs/heads/claude/new-repo-fork-package-i5w0kf' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Гига Писарь Диктовка — последняя сборка"
          body: "APK для Android (arm64, Android 10+), собран автоматически из ветки ${{ github.ref_name }}, коммит ${{ github.sha }}. Установка: скачать на телефон и открыть."
          prerelease: true
          files: |
            giga-pisar-dictation.apk
            giga-pisar-dictation.apk.sha256
